<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Export</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #172b4d; padding: 16px; }

h2 { font-size: 16px; margin-bottom: 8px; color: #5e6c84; text-transform: uppercase; letter-spacing: 0.5px; }

.field-group { margin-bottom: 16px; }
.field-group label { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; cursor: pointer; }
.section-toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.section-toggle input[type="checkbox"] { accent-color: #0079bf; width: 16px; height: 16px; }
.field-group label:hover { background: #f4f5f7; border-radius: 3px; margin: 0 -4px; padding: 6px 4px; }
.field-group input[type="checkbox"] { accent-color: #0079bf; width: 16px; height: 16px; }

.format-toggle { margin: 16px 0; display: flex; gap: 16px; }
.format-toggle label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.format-toggle input[type="radio"] { accent-color: #0079bf; }

.btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 3px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; }
.btn-primary { background: #0079bf; color: #fff; }
.btn-primary:hover { background: #026aa7; }
.btn-primary:disabled { background: #a5adba; cursor: not-allowed; }

.status { margin-top: 12px; font-size: 13px; color: #5e6c84; min-height: 20px; }
.status.error { color: #eb5a46; }
.status.success { color: #61bd4f; }
</style>
</head>
<body>

<div id="app">
  <div id="auth-section" style="display:none; text-align:center; padding:20px 0;">
    <p style="margin-bottom:12px; font-size:14px;">Authorize Board Export to access your Trello board data.</p>
    <button class="btn btn-primary" id="btn-authorize">Authorize</button>
  </div>
  <div id="export-section">
  <h2><label class="section-toggle"><input type="checkbox" id="selall-cardinfo"> Card Info</label></h2>
  <div class="field-group" data-section="selall-cardinfo">
    <label><input type="checkbox" id="chk-number" checked> Card Number</label>
    <label><input type="checkbox" id="chk-name" checked> Name</label>
    <label><input type="checkbox" id="chk-desc"> Description</label>
    <label><input type="checkbox" id="chk-url"> URL</label>
    <label><input type="checkbox" id="chk-pos"> Position</label>
  </div>

  <h2><label class="section-toggle"><input type="checkbox" id="selall-metadata"> Metadata</label></h2>
  <div class="field-group" data-section="selall-metadata">
    <label><input type="checkbox" id="chk-list" checked> List Name</label>
    <label><input type="checkbox" id="chk-start"> Start Date</label>
    <label><input type="checkbox" id="chk-due"> Due Date</label>
    <label><input type="checkbox" id="chk-labels"> Labels</label>
    <label><input type="checkbox" id="chk-members"> Members</label>
  </div>

  <h2><label class="section-toggle"><input type="checkbox" id="selall-details"> Details</label></h2>
  <div class="field-group" data-section="selall-details">
    <label><input type="checkbox" id="chk-checklists"> Checklists</label>
    <label><input type="checkbox" id="chk-comments"> Comments</label>
    <label><input type="checkbox" id="chk-attachments"> Attachments</label>
    <label><input type="checkbox" id="chk-activity"> Activity</label>
  </div>

  <div id="custom-fields-section" style="display:none;">
    <h2><label class="section-toggle"><input type="checkbox" id="selall-customfields"> Custom Fields</label></h2>
    <div class="field-group" id="custom-fields-container" data-section="selall-customfields"></div>
  </div>

  <h2><label class="section-toggle"><input type="checkbox" id="selall-freecustomfields"> Free Custom Fields</label></h2>
  <div class="field-group" data-section="selall-freecustomfields" id="free-custom-fields-container"></div>

  <details id="filter-section" style="margin-bottom:16px;">
    <summary style="font-size:13px; color:#5e6c84; cursor:pointer;">Filter Cards</summary>
    <div id="filter-controls-container" style="padding:8px 0 0;"></div>
    <button class="btn btn-primary" id="btn-apply-filter" type="button">Filter</button>
    <div id="filter-results"></div>
  </details>

  <details id="cf-settings" style="margin-bottom:16px;">
    <summary style="font-size:13px; color:#5e6c84; cursor:pointer;">Custom Fields Settings</summary>
    <div id="cf-settings-container"></div>
    <button class="btn btn-primary" id="btn-save-fields" type="button">Save Field Definitions</button>
  </details>

  <div class="format-toggle">
    <label><input type="radio" name="format" value="json"> JSON</label>
    <label><input type="radio" name="format" value="csv" checked> CSV</label>
  </div>

  <button class="btn btn-primary" id="btn-export">Export</button>
  <button class="btn" id="btn-save-columns" type="button" style="background:#f4f5f7;color:#172b4d;border:1px solid #dfe1e6;">Save Column Selection</button>
  <div id="download-area" style="display:none;"></div>
  </div>

  <div id="edit-section" style="display:none;">
    <h2 id="edit-title">Custom Fields</h2>
    <div class="field-group" id="edit-form-container"></div>
    <button class="btn btn-primary" id="btn-save-free">Save</button>
    <div class="status" id="edit-status"></div>
  </div>

  <div class="status" id="status"></div>
</div>

<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>
(function () {
  'use strict';

  var T = window.TrelloPowerUp;
  var APP_KEY = '6da32fb6fef73452b529a029b125e2a7';
  var boardName = '';
  var boardUrl = '';
  var customFieldDefs = null;
  var changeBound = false;

  var FREE_DEFS_KEY = 'freeCustomFieldDefs';
  var FREE_VALUES_KEY = 'freeCustomFieldValues';
  var EXPORT_SELECTION_KEY = 'exportFieldSelection';
  var freeFieldDefs = null;
  var DEFAULT_FIELD_DEFS = [
    { id: 'f1', name: 'Priority', type: 'select', options: ['Top/Critical', 'High', 'Medium', 'Low'] },
    { id: 'f2', name: 'Problem Type', type: 'select', options: ['Documentation', 'Request Changes', 'Cosmetics', 'Design', 'Coding', 'Clarifications', 'Environment'] },
    { id: 'f3', name: 'Notes', type: 'text', options: [] }
  ];

  function trelloFetch(path, token) {
    var sep = path.indexOf('?') !== -1 ? '&' : '?';
    var url = 'https://api.trello.com' + path + sep + 'key=' + APP_KEY + '&token=' + token;
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function getCustomFieldDisplayValue(card, def) {
    var items = card.customFieldItems || [];
    var item = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i].idCustomField === def.id) { item = items[i]; break; }
    }
    if (!item || !item.value) return '';
    switch (def.type) {
      case 'text': return item.value.text || '';
      case 'number': return item.value.number || '';
      case 'date': return item.value.date || '';
      case 'checkbox': return item.value.checked === 'true' ? 'Yes' : 'No';
      case 'list':
        var optId = item.value.id;
        var opts = def.display.options || [];
        for (var j = 0; j < opts.length; j++) {
          if (opts[j].id === optId) return opts[j].value.text || '';
        }
        return '';
      default: return '';
    }
  }

  function getCheckedCustomFieldDefs() {
    var checked = [];
    if (!customFieldDefs) return checked;
    for (var i = 0; i < customFieldDefs.length; i++) {
      var el = document.getElementById('chk-cf-' + i);
      if (el && el.checked) checked.push(customFieldDefs[i]);
    }
    return checked;
  }

  function checkCustomFields(t) {
    return t.getRestApi().getToken().then(function (token) {
      if (!token) return;
      var ctx = t.getContext();
      return trelloFetch('/1/boards/' + ctx.board + '/customFields', token);
    }).then(function (fields) {
      if (!fields) return;
      if (customFieldDefs) return;
      customFieldDefs = fields;
      if (fields.length > 0) {
        var section = document.getElementById('custom-fields-section');
        if (section) section.style.display = 'block';
        var container = document.getElementById('custom-fields-container');
        if (container) {
          for (var i = 0; i < fields.length; i++) {
            var id = 'chk-cf-' + i;
            var label = document.createElement('label');
            label.innerHTML = '<input type="checkbox" id="' + id + '"> ' + fields[i].display.name;
            container.appendChild(label);
          }
          syncSectionToggle('selall-customfields');
        }
      }
    }).catch(function () {});
  }

  function getSectionChildren(sectionId) {
    var group = document.querySelector('.field-group[data-section="' + sectionId + '"]');
    if (!group) return [];
    return group.querySelectorAll('input[type="checkbox"]');
  }

  function syncSectionToggle(sectionId) {
    var selAll = document.getElementById(sectionId);
    var children = getSectionChildren(sectionId);
    if (!selAll || children.length === 0) return;
    var checked = 0;
    for (var i = 0; i < children.length; i++) { if (children[i].checked) checked++; }
    selAll.checked = checked === children.length;
    selAll.indeterminate = checked > 0 && checked < children.length;
  }

  function wireSectionToggles() {
    var ids = ['selall-cardinfo', 'selall-metadata', 'selall-details', 'selall-customfields', 'selall-freecustomfields'];
    for (var i = 0; i < ids.length; i++) {
      (function (sectionId) {
        var selAll = document.getElementById(sectionId);
        if (!selAll) return;
        selAll.onchange = function () {
          var children = getSectionChildren(sectionId);
          for (var j = 0; j < children.length; j++) { children[j].checked = selAll.checked; }
          selAll.indeterminate = false;
        };
        syncSectionToggle(sectionId);
      })(ids[i]);
    }
    if (changeBound) return;
    changeBound = true;
    document.addEventListener('change', function (e) {
      var target = e.target;
      if (!target || target.type !== 'checkbox') return;
      var group = target.closest ? target.closest('.field-group[data-section]') : null;
      if (!group) return;
      var sectionId = group.getAttribute('data-section');
      if (sectionId && target.id !== sectionId) syncSectionToggle(sectionId);
    });
  }

  function getFreeFieldDefs() { 
    return freeFieldDefs || DEFAULT_FIELD_DEFS;
  }

  var freeFieldDefsLoaded = false;
  
  function loadFreeFieldDefs(t) {
    if (freeFieldDefsLoaded) {
      return Promise.resolve();
    }
    freeFieldDefsLoaded = true;
    
    return t.get('board', 'shared', FREE_DEFS_KEY).then(function (defs) {
      if (Array.isArray(defs) && defs.length === DEFAULT_FIELD_DEFS.length) {
        var idsMatch = true;
        for (var i = 0; i < DEFAULT_FIELD_DEFS.length; i++) {
          if (!defs[i] || defs[i].id !== DEFAULT_FIELD_DEFS[i].id) {
            idsMatch = false;
            break;
          }
        }
        if (idsMatch) {
          freeFieldDefs = defs;
          return;
        }
      }
      freeFieldDefs = DEFAULT_FIELD_DEFS.slice();
      return t.set('board', 'shared', FREE_DEFS_KEY, freeFieldDefs);
    }).catch(function () {
      freeFieldDefs = DEFAULT_FIELD_DEFS.slice();
    });
  }

  function saveFreeFieldDefs(t, defs) {
    return t.set('board', 'shared', FREE_DEFS_KEY, defs);
  }

  function renderFreeCustomFields(t) {
    return loadFreeFieldDefs(t).then(function () {
      var container = document.getElementById('free-custom-fields-container');
      if (!container) return;
      container.innerHTML = '';
      var defs = getFreeFieldDefs();
      for (var i = 0; i < defs.length; i++) {
        var id = 'chk-free-' + i;
        var label = document.createElement('label');
        label.innerHTML = '<input type="checkbox" id="' + id + '"> ' + defs[i].name;
        container.appendChild(label);
      }
      syncSectionToggle('selall-freecustomfields');
    });
  }

  function renderSettings() {
    var container = document.getElementById('cf-settings-container');
    if (!container) return;
    container.innerHTML = '';
    var defs = getFreeFieldDefs();
    for (var i = 0; i < defs.length; i++) {
      var def = defs[i];
      var fieldset = document.createElement('fieldset');
      fieldset.style.cssText = 'border:1px solid #dfe1e6;border-radius:3px;padding:8px;margin:0 0 8px;';
      var legend = document.createElement('legend');
      legend.textContent = def.name;
      legend.style.cssText = 'font-size:12px;color:#5e6c84;padding:0 4px;';
      fieldset.appendChild(legend);
      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = def.name;
      nameInput.id = 'cfg-name-' + i;
      nameInput.style.cssText = 'width:100%;padding:6px;';
      fieldset.appendChild(nameInput);
      if (def.type === 'select') {
        var optsInput = document.createElement('input');
        optsInput.type = 'text';
        optsInput.value = (def.options || []).join(', ');
        optsInput.id = 'cfg-options-' + i;
        optsInput.style.cssText = 'width:100%;padding:6px;margin-top:4px;';
        fieldset.appendChild(optsInput);
      }
      container.appendChild(fieldset);
    }
  }

  function buildFilterControls() {
    var container = document.getElementById('filter-controls-container');
    if (!container) return;
    container.innerHTML = '';
    var defs = getFreeFieldDefs();
    for (var i = 0; i < defs.length; i++) {
      var def = defs[i];
      var row = document.createElement('label');
      row.style.cssText = 'display:block;padding:6px 0;font-size:14px;';
      row.appendChild(document.createTextNode(def.name + ': '));
      if (def.type === 'select') {
        var sel = document.createElement('select');
        sel.id = 'filter-field-' + i;
        sel.style.cssText = 'width:100%;padding:6px;margin-top:4px;';
        var all = document.createElement('option');
        all.value = '';
        all.textContent = '(All)';
        sel.appendChild(all);
        var none = document.createElement('option');
        none.value = '__none__';
        none.textContent = '(none)';
        sel.appendChild(none);
        (def.options || []).forEach(function (opt) {
          var o = document.createElement('option');
          o.value = opt;
          o.textContent = opt;
          sel.appendChild(o);
        });
        row.appendChild(sel);
      } else {
        var input = document.createElement('input');
        input.type = 'text';
        input.id = 'filter-field-' + i;
        input.placeholder = 'Search...';
        input.style.cssText = 'width:100%;padding:6px;margin-top:4px;';
        row.appendChild(input);
      }
      container.appendChild(row);
    }
  }

  function cardPassesFilter(card, values, defs) {
    for (var i = 0; i < defs.length; i++) {
      var def = defs[i];
      var el = document.getElementById('filter-field-' + i);
      if (!el) continue;
      var raw = el.value;
      var v = values && values[card.id] ? values[card.id][def.id] : undefined;
      var hasValue = v !== undefined && v !== '';
      if (def.type === 'select') {
        if (raw === '__none__') {
          if (hasValue) return false;
        } else if (raw !== '') {
          if (v !== raw) return false;
        }
      } else {
        var q = raw.trim();
        if (q !== '' && String(v === undefined ? '' : v).toLowerCase().indexOf(q.toLowerCase()) === -1) return false;
      }
    }
    return true;
  }

  function renderFilterResults(cards, freeValues, defs) {
    var area = document.getElementById('filter-results');
    if (!area) return;
    area.innerHTML = '';
    var count = document.createElement('p');
    count.style.cssText = 'font-size:13px;color:#5e6c84;margin:8px 0 4px;';
    count.textContent = cards.length === 0 ? 'No matching cards.' : (cards.length + ' matching card' + (cards.length === 1 ? '' : 's') + '.');
    area.appendChild(count);
    cards.forEach(function (card) {
      var row = document.createElement('div');
      row.style.cssText = 'padding:8px;border:1px solid #dfe1e6;border-radius:3px;margin:6px 0;font-size:13px;';
      var link = document.createElement('a');
      link.href = card.url;
      link.target = '_blank';
      link.textContent = card.name;
      link.style.cssText = 'color:#0079bf;text-decoration:none;font-weight:500;';
      row.appendChild(link);
      var meta = document.createElement('div');
      meta.style.cssText = 'color:#5e6c84;font-size:12px;margin:2px 0;';
      meta.textContent = '#' + card.idShort + ' · ' + (card.list ? card.list.name : '');
      row.appendChild(meta);
      var fv = freeValues && freeValues[card.id] ? freeValues[card.id] : {};
      var parts = [];
      for (var i = 0; i < defs.length; i++) {
        var val = fv[defs[i].id];
        parts.push(defs[i].name + ': ' + (val === undefined || val === '' ? '(none)' : val));
      }
      var line = document.createElement('div');
      line.style.cssText = 'font-size:12px;color:#172b4d;';
      line.textContent = parts.join(' · ');
      row.appendChild(line);
      area.appendChild(row);
    });
  }

  function applyFilter(t) {
    var btn = document.getElementById('btn-apply-filter');
    var step = 'init';
    try {
      setStatus('Filtering...', '');
      if (btn) btn.disabled = true;
      var ctx = t.getContext();
      var boardId = ctx.board;
      step = 'getToken';
      t.getRestApi().getToken().then(function (token) {
        if (!token) {
          if (btn) btn.disabled = false;
          setStatus('Not authorized. Click Authorize first.', 'error');
          return null;
        }
        step = 'getCards';
        return trelloFetch(buildApiUrl(boardId), token);
      }).then(function (cards) {
        if (!cards) return;
        var defs = getFreeFieldDefs();
        return fetchFreeValues(t, cards).then(function (valuesMap) {
          var matched = cards.filter(function (card) { return cardPassesFilter(card, valuesMap, defs); });
          renderFilterResults(matched, valuesMap, defs);
          if (btn) btn.disabled = false;
          setStatus('Filtered ' + matched.length + ' of ' + cards.length + ' cards.', 'success');
        });
      }).catch(function (err) {
        if (btn) btn.disabled = false;
        var msg = err && (err.message || err.statusText || err) || 'unknown error';
        setStatus('Filter failed (step=' + step + '): ' + msg, 'error');
      });
    } catch (e) {
      if (btn) btn.disabled = false;
      setStatus('Filter failed (sync, step=' + step + '): ' + (e && (e.message || e) || 'unknown error'), 'error');
    }
  }

  function collectSettings() {
    var defs = [];
    var base = getFreeFieldDefs();
    for (var i = 0; i < base.length; i++) {
      var def = { id: 'f' + (i + 1), name: document.getElementById('cfg-name-' + i).value.trim(), type: base[i].type, options: [] };
      if (def.type === 'select') {
        var optsEl = document.getElementById('cfg-options-' + i);
        def.options = (optsEl ? optsEl.value : '').split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s !== ''; });
      }
      defs.push(def);
    }
    return defs;
  }

  function getCheckedFreeFieldDefs() {
    var defs = getFreeFieldDefs();
    var checked = [];
    for (var i = 0; i < defs.length; i++) {
      var el = document.getElementById('chk-free-' + i);
      if (el && el.checked) checked.push(defs[i]);
    }
    return checked;
  }

  function collectExportSelection() {
    var sel = {};
    var inputs = document.querySelectorAll('.field-group input[type="checkbox"]');
    for (var i = 0; i < inputs.length; i++) {
      sel[inputs[i].id] = inputs[i].checked;
    }
    return sel;
  }

  function defaultExportSelection() {
    var sel = {};
    Object.keys(FIELD_IDS).forEach(function (key) { sel[FIELD_IDS[key]] = false; });
    sel['chk-number'] = true;
    sel['chk-name'] = true;
    sel['chk-list'] = true;
    var freeContainer = document.getElementById('free-custom-fields-container');
    var freeInputs = freeContainer ? freeContainer.querySelectorAll('input[type="checkbox"]') : [];
    for (var i = 0; i < freeInputs.length; i++) {
      sel[freeInputs[i].id] = (freeInputs[i].id === 'chk-free-0' || freeInputs[i].id === 'chk-free-1');
    }
    return sel;
  }

  function applyExportSelection(sel) {
    if (!sel) return;
    var inputs = document.querySelectorAll('.field-group input[type="checkbox"]');
    for (var i = 0; i < inputs.length; i++) {
      if (sel.hasOwnProperty(inputs[i].id)) inputs[i].checked = !!sel[inputs[i].id];
    }
    var ids = ['selall-cardinfo', 'selall-metadata', 'selall-details', 'selall-customfields', 'selall-freecustomfields'];
    for (var j = 0; j < ids.length; j++) syncSectionToggle(ids[j]);
  }

  function loadExportSelection(t) {
    return t.get('member', 'private', EXPORT_SELECTION_KEY, {}).then(function (saved) {
      if (saved && typeof saved === 'object' && Object.keys(saved).length > 0) applyExportSelection(saved);
      else applyExportSelection(defaultExportSelection());
    }).catch(function () {
      applyExportSelection(defaultExportSelection());
    });
  }

  function saveExportSelection(t, btn) {
    var sel = collectExportSelection();
    if (btn) btn.disabled = true;
    return t.set('member', 'private', EXPORT_SELECTION_KEY, sel).then(function () {
      if (btn) btn.disabled = false;
      setStatus('Column selection saved.', 'success');
    }).catch(function (err) {
      if (btn) btn.disabled = false;
      setStatus('Save failed: ' + (err && (err.message || err) || 'unknown error'), 'error');
    });
  }

  function fetchFreeValues(t, cards) {
    var results = {};
    function chunk(start) {
      if (start >= cards.length) return Promise.resolve(results);
      var slice = cards.slice(start, start + 20);
      return Promise.all(slice.map(function (c) {
        return t.get(c.id, 'shared', FREE_VALUES_KEY).then(function (v) {
          if (v) results[c.id] = v;
        }).catch(function () {});
      })).then(function () { return chunk(start + 20); });
    }
    return chunk(0);
  }

  function fetchLists(t, boardId) {
    return t.getRestApi().getToken().then(function (token) {
      if (!token) return Promise.resolve({});
      return trelloFetch('/1/boards/' + boardId + '/lists?fields=name', token);
    }).then(function (lists) {
      var map = {};
      if (Array.isArray(lists)) {
        for (var i = 0; i < lists.length; i++) {
          map[lists[i].id] = lists[i].name;
        }
      }
      return map;
    }).catch(function () {
      return {};
    });
  }

  function setEditStatus(text, cls) {
    var el = document.getElementById('edit-status');
    if (!el) return;
    el.textContent = text;
    el.className = 'status ' + (cls || '');
  }

  function initEdit(t) {
    var ctx = t.getContext();
    var cardId = ctx.card;
    document.getElementById('export-section').style.display = 'none';
    document.getElementById('edit-section').style.display = 'block';
    loadFreeFieldDefs(t).then(function () {
      return t.get(cardId, 'shared', FREE_VALUES_KEY, {}).then(function (values) {
        renderEditForm(t, cardId, getFreeFieldDefs(), values || {});
      });
    }).catch(function () {
      setEditStatus('Could not load custom field definitions.', 'error');
    });
  }

  function renderEditForm(t, cardId, defs, values) {
    var container = document.getElementById('edit-form-container');
    if (!container) return;
    container.innerHTML = '';
    for (var i = 0; i < defs.length; i++) {
      var def = defs[i];
      var row = document.createElement('label');
      row.style.cssText = 'display:block;padding:6px 0;font-size:14px;';
      row.appendChild(document.createTextNode(def.name + ': '));
      var current = values[def.id] || '';
      var input;
      if (def.type === 'select') {
        input = document.createElement('select');
        input.id = 'edit-free-' + i;
        var none = document.createElement('option');
        none.value = '';
        none.textContent = '(none)';
        input.appendChild(none);
        (def.options || []).forEach(function (opt) {
          var o = document.createElement('option');
          o.value = opt;
          o.textContent = opt;
          if (opt === current) o.selected = true;
          input.appendChild(o);
        });
      } else {
        input = document.createElement('input');
        input.type = 'text';
        input.id = 'edit-free-' + i;
        input.value = current;
        input.style.cssText = 'width:100%;padding:6px;';
      }
      row.appendChild(input);
      container.appendChild(row);
    }
    var saveBtn = document.getElementById('btn-save-free');
    if (!saveBtn) return;
    saveBtn.disabled = false;
    saveBtn.onclick = function () {
      var valuesOut = {};
      for (var j = 0; j < defs.length; j++) {
        var el = document.getElementById('edit-free-' + j);
        var v = el ? el.value.trim() : '';
        if (v !== '') valuesOut[defs[j].id] = v;
      }
      saveBtn.disabled = true;
      setEditStatus('Saving...', '');
      doEditSave(t, cardId, valuesOut, saveBtn);
    };
  }

  function doEditSave(t, cardId, values, saveBtn) {
    t.set('card', 'shared', FREE_VALUES_KEY, values).then(function () {
      t.closePopup();
    }).catch(function () {
      saveBtn.disabled = true;
      setEditStatus('Save failed. Re-authorize to enable editing.', 'error');
      t.getRestApi().authorize({ scope: 'write' }).then(function () {
        return t.set('card', 'shared', FREE_VALUES_KEY, values);
      }).then(function () {
        t.closePopup();
      }).catch(function (err) {
        saveBtn.disabled = false;
        setEditStatus('Save failed: ' + (err && (err.message || err) || 'unknown error'), 'error');
      });
    });
  }

  var FIELD_IDS = {
    number: 'chk-number', name: 'chk-name', desc: 'chk-desc', url: 'chk-url', pos: 'chk-pos',
    list: 'chk-list', start: 'chk-start', due: 'chk-due', labels: 'chk-labels', members: 'chk-members',
    checklists: 'chk-checklists', comments: 'chk-comments',
    attachments: 'chk-attachments', activity: 'chk-activity'
  };

  function isChecked(id) { return document.getElementById(FIELD_IDS[id]).checked; }

  function getFormat() {
    var radios = document.getElementsByName('format');
    for (var i = 0; i < radios.length; i++) {
      if (radios[i].checked) return radios[i].value;
    }
    return 'csv';
  }

  function setStatus(text, cls) {
    var el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status ' + (cls || '');
  }

  function escapeCsv(value) {
    if (value == null) return '';
    var str = String(value).replace(/"/g, '""');
    return '"' + str + '"';
  }

  function formatChecklist(checklists) {
    if (!checklists || checklists.length === 0) return '';
    return checklists.map(function (cl) {
      return 'Checklist: ' + cl.name + '\n' + (cl.checkItems || []).map(function (item) {
        return '  [' + (item.state === 'complete' ? 'x' : ' ') + '] ' + item.name;
      }).join('\n');
    }).join('\n\n');
  }

  function isCommentAction(a) { return a.type === 'commentCard' || a.type === 'copyCommentCard'; }

  function getComments(actions) {
    if (!actions) return [];
    return actions.filter(isCommentAction);
  }

  function getActivity(actions) {
    if (!actions) return [];
    return actions.filter(function (a) { return !isCommentAction(a); });
  }

  function formatComments(comments) {
    if (!comments || comments.length === 0) return '';
    return comments.map(function (c) {
      var author = c.memberCreator ? c.memberCreator.fullName : 'Unknown';
      var text = c.data && c.data.text ? c.data.text : '';
      return author + ' (' + c.date + '): ' + text;
    }).join('\n');
  }

  function formatAttachments(attachments) {
    if (!attachments || attachments.length === 0) return '';
    return attachments.map(function (a) {
      return a.name + ' (' + a.url + ')';
    }).join('\n');
  }

  var ACTION_TEXT = {
    createCard: 'created this card',
    updateCard: 'updated this card',
    moveCardToBoard: 'moved this card to the board',
    moveCardFromBoard: 'moved this card from the board',
    addLabelToCard: 'added a label',
    removeLabelFromCard: 'removed a label',
    addMemberToCard: 'added a member',
    removeMemberFromCard: 'removed a member',
    addAttachmentToCard: 'added an attachment',
    deleteAttachmentFromCard: 'deleted an attachment'
  };

  function formatActivity(actions) {
    if (!actions || actions.length === 0) return '';
    return actions.map(function (a) {
      var member = a.memberCreator ? a.memberCreator.fullName : 'System';
      var text = ACTION_TEXT[a.type] || a.type;
      return a.date + ' ' + member + ' ' + text;
    }).join('\n');
  }

  function buildCardData(card, freeValues, listsMap) {
    var obj = {};
    if (isChecked('number')) obj.cardNumber = card.idShort;
    if (isChecked('name'))  obj.name = card.name;
    if (isChecked('desc'))  obj.description = card.desc;
    if (isChecked('url'))   obj.url = card.url;
    if (isChecked('pos'))   obj.position = card.pos;
    if (isChecked('list'))  obj.listName = listsMap ? (listsMap[card.idList] || '') : (card.list ? card.list.name : '');
    if (isChecked('start')) obj.startDate = card.start || '';
    if (isChecked('due'))   obj.dueDate = card.due || '';
    if (isChecked('labels')) obj.labels = (card.labels || []).map(function (l) { return { name: l.name, color: l.color }; });
    if (isChecked('members')) obj.members = (card.members || []).map(function (m) { return { fullName: m.fullName, initials: m.initials }; });
    if (isChecked('checklists')) obj.checklists = (card.checklists || []).map(function (cl) {
      return { name: cl.name, items: (cl.checkItems || []).map(function (item) { return { name: item.name, state: item.state }; }) };
    });
    if (isChecked('comments'))  obj.comments = getComments(card.actions).map(function (c) {
      return { text: c.data && c.data.text ? c.data.text : '', memberCreator: c.memberCreator ? c.memberCreator.fullName : 'Unknown', date: c.date };
    });
    if (isChecked('attachments')) obj.attachments = (card.attachments || []).map(function (a) {
      return { name: a.name, url: a.url, date: a.date };
    });
    if (isChecked('activity')) obj.activity = getActivity(card.actions).map(function (a) {
      return { type: a.type, date: a.date, memberCreator: a.memberCreator ? a.memberCreator.fullName : 'System', text: a.data && a.data.text ? a.data.text : (a.data && a.data.card ? a.data.card.name : '') };
    });
    var cfDefs = getCheckedCustomFieldDefs();
    for (var ci = 0; ci < cfDefs.length; ci++) {
      obj[cfDefs[ci].display.name] = getCustomFieldDisplayValue(card, cfDefs[ci]);
    }
    var fv = freeValues && freeValues[card.id] ? freeValues[card.id] : {};
    var fdefs = getCheckedFreeFieldDefs();
    for (var fi = 0; fi < fdefs.length; fi++) {
      var fval = fv[fdefs[fi].id];
      if (fval !== undefined && fval !== '') obj[fdefs[fi].name] = fval;
    }
    return obj;
  }

  function getCheckedFields() {
    var fields = [];
    Object.keys(FIELD_IDS).forEach(function (key) {
      if (isChecked(key)) fields.push(key);
    });
    return fields;
  }

  function sanitizeFilename(name) {
    return String(name || 'export').replace(/[^a-zA-Z0-9_\-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80) || 'export';
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function buildExportFilename(ext) {
    var now = new Date();
    var stamp = now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate())
      + '_' + pad2(now.getHours()) + pad2(now.getMinutes()) + pad2(now.getSeconds());
    return sanitizeFilename(boardName) + '_' + stamp + '.' + ext;
  }

  function showDownloadUi(filename, content, mimeType) {
    var area = document.getElementById('download-area');
    if (!area) return;
    area.style.display = 'block';
    area.innerHTML = '';

    var blob = new Blob([content], { type: mimeType || 'application/octet-stream' });
    var url = URL.createObjectURL(blob);

    var dlBtn = document.createElement('a');
    dlBtn.href = url;
    dlBtn.download = filename;
    dlBtn.className = 'btn btn-primary';
    dlBtn.textContent = 'Download ' + filename;
    dlBtn.style.cssText = 'margin:8px 0;display:inline-block;text-decoration:none;text-align:center;';
    dlBtn.setAttribute('rel', 'noopener');
    dlBtn.onclick = function () {
      setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
    };
    area.appendChild(dlBtn);

    var hint = document.createElement('p');
    hint.style.cssText = 'font-size:12px;color:#5e6c84;margin:4px 0;';
    hint.textContent = 'Click the button above to download. File will be saved to your Downloads folder.';
    area.appendChild(hint);

    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.textContent = 'Show content';
    toggle.style.cssText = 'background:none;border:1px solid #dfe1e6;color:#5e6c84;cursor:pointer;padding:4px 8px;border-radius:3px;font-size:12px;';
    area.appendChild(toggle);

    var pre = document.createElement('pre');
    pre.style.cssText = 'display:none;margin-top:8px;max-height:200px;overflow:auto;background:#f4f5f7;padding:8px;border-radius:3px;font-size:12px;white-space:pre-wrap;word-break:break-all;';
    pre.textContent = content.length > 50000 ? content.slice(0, 50000) + '\n... [truncated]' : content;
    area.appendChild(pre);

    toggle.onclick = function () {
      pre.style.display = pre.style.display === 'none' ? 'block' : 'none';
      toggle.textContent = pre.style.display === 'none' ? 'Show content' : 'Hide content';
    };
  }

  function exportJSON(cards, freeValues, listsMap) {
    var checkedFields = getCheckedFields();
    var cfDefs = getCheckedCustomFieldDefs();
    if (checkedFields.length === 0 && cfDefs.length === 0 && getCheckedFreeFieldDefs().length === 0) { setStatus('Select at least one field.', 'error'); return; }

    var data = { board: { name: boardName, url: boardUrl, exportedAt: new Date().toISOString() }, cards: [] };
    cards.forEach(function (card) { data.cards.push(buildCardData(card, freeValues, listsMap)); });

    var filename = buildExportFilename('json');
    var content = JSON.stringify(data, null, 2);
    showDownloadUi(filename, content, 'application/json');
    setStatus('Exported ' + cards.length + ' cards as JSON → ' + filename + '.', 'success');
  }

  function exportCSV(cards, freeValues, listsMap) {
    var checkedFields = getCheckedFields();
    var cfDefs = getCheckedCustomFieldDefs();
    if (checkedFields.length === 0 && cfDefs.length === 0 && getCheckedFreeFieldDefs().length === 0) { setStatus('Select at least one field.', 'error'); return; }

    var headers = [];
    checkedFields.forEach(function (f) {
      if (f === 'number') headers.push('Card #');
      else if (f === 'checklists') headers.push('Checklists');
      else if (f === 'comments') headers.push('Comments');
      else if (f === 'attachments') headers.push('Attachments');
      else if (f === 'activity') headers.push('Activity');
      else headers.push(f.charAt(0).toUpperCase() + f.slice(1));
    });
    for (var cfi = 0; cfi < cfDefs.length; cfi++) {
      headers.push(cfDefs[cfi].display.name);
    }
    var fdefs = getCheckedFreeFieldDefs();
    for (var fhi = 0; fhi < fdefs.length; fhi++) {
      headers.push(fdefs[fhi].name);
    }

    var rows = [headers.map(escapeCsv).join(',')];

    cards.forEach(function (card) {
      var row = [];
      checkedFields.forEach(function (f) {
        var val;
        switch (f) {
          case 'name':  val = card.name; break;
          case 'number': val = card.idShort; break;
          case 'desc':  val = card.desc; break;
          case 'url':   val = card.url; break;
          case 'pos':   val = card.pos; break;
          case 'list':  val = listsMap ? (listsMap[card.idList] || '') : (card.list ? card.list.name : ''); break;
          case 'start': val = card.start || ''; break;
          case 'due':   val = card.due || ''; break;
          case 'labels': val = (card.labels || []).map(function (l) { return l.name || l.color; }).join(', '); break;
          case 'members': val = (card.members || []).map(function (m) { return m.fullName; }).join(', '); break;
          case 'checklists': val = formatChecklist(card.checklists); break;
          case 'comments': val = formatComments(getComments(card.actions)); break;
          case 'attachments': val = formatAttachments(card.attachments); break;
          case 'activity': val = formatActivity(getActivity(card.actions)); break;
        }
        row.push(escapeCsv(val));
      });
      for (var cfj = 0; cfj < cfDefs.length; cfj++) {
        row.push(escapeCsv(getCustomFieldDisplayValue(card, cfDefs[cfj])));
      }
      var fv = freeValues && freeValues[card.id] ? freeValues[card.id] : {};
      for (var fdi = 0; fdi < fdefs.length; fdi++) {
        var fvVal = fv[fdefs[fdi].id];
        row.push(escapeCsv(fvVal !== undefined ? fvVal : ''));
      }
      rows.push(row.join(','));
    });

    var filename = buildExportFilename('csv');
    var content = '\uFEFF' + rows.join('\n');
    showDownloadUi(filename, content, 'text/csv;charset=utf-8');
    setStatus('Exported ' + cards.length + ' cards as CSV → ' + filename + '.', 'success');
  }

  function buildApiUrl(boardId) {
    var needNested = isChecked('checklists') || isChecked('comments') || isChecked('attachments') || isChecked('activity');
    var base = '/1/boards/' + boardId + '/cards?fields=name,idShort,idList,desc,url,pos,due,start,labels&list=true&members=true&labels=all&customFieldItems=true';
    if (needNested) {
      base += '&checklists=all&checkItems=all';
      base += '&actions=commentCard,copyCommentCard,createCard,moveCardToBoard,moveCardFromBoard,updateCard,addLabelToCard,removeLabelFromCard,addMemberToCard,removeMemberFromCard,addAttachmentToCard,deleteAttachmentFromCard';
      base += '&attachments=true&attachment_fields=name,url,date';
    }
    return base;
  }

  function doExport(t) {
    var btn = document.getElementById('btn-export');
    var step = 'init';
    var token = null;
    try {
      setStatus('Loading...', '');
      btn.disabled = true;

      step = 'getContext';
      var ctx = t.getContext();
      var boardId = ctx.board;
      boardUrl = 'https://trello.com/b/' + ctx.board;

      step = 'getToken';
      t.getRestApi().getToken().then(function (tok) {
        token = tok;
        if (!token) {
          btn.disabled = false;
          setStatus('Not authorized. Click Authorize first.', 'error');
          return null;
        }
        step = 'getBoard';
        return trelloFetch('/1/boards/' + boardId + '?fields=name', token);
      }).then(function (board) {
        if (!board) return null;
        step = 'getBoard_done';
        setStatus('Board: ' + board.name, '');
        boardName = board.name;
        step = 'getCards';
        return trelloFetch(buildApiUrl(boardId), token);
      }).then(function (cards) {
        if (!cards) return;
        step = 'getCards_done';
        btn.disabled = false;
        if (!cards || cards.length === 0) {
          setStatus('No cards found on this board. Exporting empty file.', '');
          cards = [];
        }
        var fmt = getFormat();
        var freeChecked = getCheckedFreeFieldDefs();
        var needListNames = isChecked('list');
        var getValues = freeChecked.length > 0 ? fetchFreeValues(t, cards) : Promise.resolve({});
        var getLists = needListNames ? fetchLists(t, boardId) : Promise.resolve({});
        return Promise.all([getValues, getLists]).then(function (results) {
          if (fmt === 'json') exportJSON(cards, results[0], results[1]);
          else exportCSV(cards, results[0], results[1]);
        });
      }).catch(function (err) {
        btn.disabled = false;
        var msg = err && (err.message || err.statusText || err) || 'unknown error';
        setStatus('Export failed (step=' + step + '): ' + msg, 'error');
      });
    } catch (e) {
      if (btn) btn.disabled = false;
      setStatus('Export failed (sync, step=' + step + '): ' + (e && (e.message || e) || 'unknown error'), 'error');
    }
  }

  function getBadgeColor(value) {
    var v = String(value || '').toLowerCase();
    if (v === 'top/critical' || v === 'critical') return 'red';
    if (v === 'high') return 'orange';
    if (v === 'medium') return 'yellow';
    if (v === 'low') return 'sky';
    return 'blue';
  }

  var isPopup = window.location.hash.indexOf('popup') !== -1 || window.location.search.indexOf('popup') !== -1;
  var isEdit = window.location.search.indexOf('edit') !== -1;

  if (isPopup) {
    try {
      var t = T.iframe({ appKey: APP_KEY, appName: 'Board Export', appAuthor: 'Trello Export' });
      t.render(function () {
        if (isEdit) { initEdit(t); return; }
        var btn = document.getElementById('btn-export');
        if (btn) btn.onclick = function () { doExport(t); };
        var saveColsBtn = document.getElementById('btn-save-columns');
        if (saveColsBtn) saveColsBtn.onclick = function () { saveExportSelection(t, saveColsBtn); };
        wireSectionToggles();
        var filterBtn = document.getElementById('btn-apply-filter');
        if (filterBtn) filterBtn.onclick = function () { applyFilter(t); };
        var saveFieldsBtn = document.getElementById('btn-save-fields');
        if (saveFieldsBtn) saveFieldsBtn.onclick = function () {
          saveFieldsBtn.disabled = true;
          var collected = collectSettings();
          freeFieldDefs = collected;
          saveFreeFieldDefs(t, collected).then(function () {
            saveFieldsBtn.disabled = false;
            renderSettings();
            setStatus('Field definitions saved.', 'success');
          }).catch(function (err) {
            saveFieldsBtn.disabled = false;
            setStatus('Save failed: ' + (err && (err.message || err) || 'unknown error'), 'error');
          });
        };
        var authBtn = document.getElementById('btn-authorize');
        if (authBtn) authBtn.onclick = function () {
          setStatus('Authorizing...', '');
          authBtn.disabled = true;
          t.getRestApi().authorize({ scope: 'read' }).then(function () {
            authBtn.disabled = false;
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('export-section').style.display = 'block';
            Promise.all([checkCustomFields(t), renderFreeCustomFields(t)]).then(function () {
              renderSettings();
              buildFilterControls();
              return loadExportSelection(t);
            });
            setStatus('Authorized! Click Export to continue.', '');
          }).catch(function (err) {
            authBtn.disabled = false;
            setStatus('Authorization failed: ' + (err && (err.message || err) || 'unknown error'), 'error');
          });
        };
        t.getRestApi().isAuthorized().then(function (authed) {
          if (authed) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('export-section').style.display = 'block';
            Promise.all([checkCustomFields(t), renderFreeCustomFields(t)]).then(function () {
              renderSettings();
              buildFilterControls();
              return loadExportSelection(t);
            });
          } else {
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('export-section').style.display = 'none';
          }
        });
      });
    } catch (e) {}
  } else {
    T.initialize({
      'board-buttons': function (t) {
        return [{
          icon: {
            dark: 'https://stephenmanasl.github.io/trello_exporter/icon.svg',
            light: 'https://stephenmanasl.github.io/trello_exporter/icon.svg'
          },
          text: 'Export Board',
          condition: 'always',
          callback: function (t) {
            return t.popup({
              title: 'Export Board',
              url: t.signUrl('./index.html?popup=1'),
              height: 640
            });
          }
        }];
      },
      'card-buttons': function (t) {
        return [{
          icon: 'https://stephenmanasl.github.io/trello_exporter/icon.svg',
          text: 'Custom Fields',
          condition: 'always',
          callback: function (t) {
            return t.popup({
              title: 'Custom Fields',
              url: t.signUrl('./index.html?popup=1&edit=1'),
              height: 400
            });
          }
        }];
      },
      'card-badges': function (t, opts) {
        return t.card('id', 'name').then(function (card) {
          return t.get(card.id, 'shared', FREE_VALUES_KEY, {}).then(function (values) {
            return { card: card, values: values || {} };
          });
        }).then(function (data) {
          return loadFreeFieldDefs(t).then(function () {
            var defs = getFreeFieldDefs();
            var badges = [];
            for (var i = 0; i < defs.length; i++) {
              var def = defs[i];
              var value = data.values[def.id];
              if (value === undefined || value === '') continue;
              badges.push({ text: value, color: getBadgeColor(value) });
            }
            return badges;
          });
        }).catch(function () {
          return [];
        });
      },
      'card-detail-badges': function (t, opts) {
        return t.card('id').then(function (card) {
          return t.get(card.id, 'shared', FREE_VALUES_KEY, {}).then(function (values) {
            return { card: card, values: values || {} };
          });
        }).then(function (data) {
          return loadFreeFieldDefs(t).then(function () {
            var defs = getFreeFieldDefs();
            var badges = [];
            for (var i = 0; i < defs.length; i++) {
              var def = defs[i];
              var value = data.values[def.id];
              var empty = value === undefined || value === '';
              badges.push({
                title: def.name,
                text: empty ? '(none)' : value,
                color: empty ? 'gray' : getBadgeColor(value),
                callback: function (t) {
                  return t.popup({
                    title: 'Edit Custom Fields',
                    url: t.signUrl('./index.html?popup=1&edit=1'),
                    height: 400
                  });
                }
              });
            }
            return badges;
          });
        }).catch(function () {
          return [];
        });
      }
    });
  }
})();
</script>
